name: Sync DTEK Schedule to PythonAnywhere

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync-dtek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch DTEK schedule and push to PythonAnywhere
        env:
          TARGET_URL: https://Onoff.pythonanywhere.com/api/dtek/push-snapshot
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 - << 'PY'
          import json, os, sys, time, urllib.error, urllib.request

          DTEK_URL = os.environ.get('DTEK_URL') or 'https://www.dtek-dnem.com.ua/ua/shutdowns'
          TARGET_URL = os.environ['TARGET_URL']
          SECRET = os.environ.get('CRON_SECRET', 'dtek2026secret')
          if not SECRET:
              sys.exit('CRON_SECRET is empty: add it in Settings -> Secrets and variables -> Actions -> New repository secret')

          def fetch(url, tries=3):
              last = ''
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0.0.0',
                          'Accept': 'text/html,application/xhtml+xml',
                          'Accept-Language': 'uk-UA,uk;q=0.9',
                      })
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return r.read().decode('utf-8', 'ignore')
                  except urllib.error.HTTPError as e:
                      last = f'HTTP {e.code}'
                      if e.code in (401, 403):
                          break
                  except Exception as e:
                      last = repr(e)
                  time.sleep(3 * (i + 1))
              sys.exit(f'Cannot download the DTEK page ({last}). If this is HTTP 403, DTEK blocks GitHub servers: see README, plan B.')

          html = fetch(DTEK_URL)

          def extract_json(prefix):
              marker = f'{prefix} = '
              idx = html.find(marker)
              if idx == -1:
                  return None
              pos = idx + len(marker)
              while pos < len(html) and html[pos] not in '{[':
                  pos += 1
              open_ch = html[pos]
              close_ch = '}' if open_ch == '{' else ']'
              depth, in_str, esc = 0, False, False
              for i in range(pos, len(html)):
                  ch = html[i]
                  if esc:
                      esc = False
                      continue
                  if ch == '\\' and in_str:
                      esc = True
                      continue
                  if ch == '"':
                      in_str = not in_str
                      continue
                  if not in_str:
                      if ch == open_ch:
                          depth += 1
                      elif ch == close_ch:
                          depth -= 1
                          if depth == 0:
                              return json.loads(html[pos : i + 1])
              return None

          fact = extract_json('DisconSchedule.fact') or {}
          preset = extract_json('DisconSchedule.preset') or {}
          days = fact.get('data') or {}
          if not days:
              sys.exit('DTEK page was downloaded, but the schedule (DisconSchedule.fact) is empty or missing')

          groups = sorted({g for dm in days.values() for g in dm.keys()})
          group_names = {g: f"Черга {g.replace('GPV', '')}" for g in groups}
          group_names.update(preset.get('sch_names') or {})
          print(f'DTEK days in data: {len(days)}, queues: {len(groups)}, updated: {fact.get("update", "")}')

          payload = {
              'snapshot': {
                  'today': fact.get('today'),
                  'update': fact.get('update', ''),
                  'groups': groups,
                  'days': days,
                  'groupNames': group_names,
              }
          }
          body = json.dumps(payload, ensure_ascii=False).encode('utf-8')
          push_req = urllib.request.Request(
              f'{TARGET_URL}?secret={SECRET}',
              data=body,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              resp = urllib.request.urlopen(push_req, timeout=30).read().decode('utf-8')
              print('Push result:', resp)
          except urllib.error.HTTPError as e:
              sys.exit(f'Server rejected the push: HTTP {e.code} {e.read().decode("utf-8", "ignore")[:200]} (check that CRON_SECRET matches the one in your PythonAnywhere WSGI file)')
          PY
          
