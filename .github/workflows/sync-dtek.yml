name: Sync DTEK Schedule to PythonAnywhere

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync-dtek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch DTEK schedule and push to PythonAnywhere
        env:
          TARGET_URL: https://Onoff.pythonanywhere.com/api/dtek/push-snapshot
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 - << 'PY'
          import http.cookiejar, json, os, re, sys, time, urllib.error, urllib.parse, urllib.request

          DTEK_URL = os.environ.get('DTEK_URL') or 'https://www.dtek-dnem.com.ua/ua/shutdowns'
          DTEK_AJAX_URL = os.environ.get('DTEK_AJAX_URL') or 'https://www.dtek-dnem.com.ua/ua/ajax'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0.0.0'
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          TARGET_URL = os.environ['TARGET_URL']
          SECRET = os.environ.get('CRON_SECRET', 'dtek2026secret').strip()
          if not SECRET:
              sys.exit('CRON_SECRET is empty: add it in Settings -> Secrets and variables -> Actions -> New repository secret')

          def fetch(url, tries=3):
              last = ''
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': UA,
                          'Accept': 'text/html,application/xhtml+xml',
                          'Accept-Language': 'uk-UA,uk;q=0.9',
                      })
                      with opener.open(req, timeout=25) as r:
                          return r.read().decode('utf-8', 'ignore')
                  except urllib.error.HTTPError as e:
                      last = f'HTTP {e.code}'
                      if e.code in (401, 403):
                          break
                  except Exception as e:
                      last = repr(e)
                  time.sleep(3 * (i + 1))
              sys.exit(f'Cannot download the DTEK page ({last}). If this is HTTP 403, DTEK blocks GitHub servers: see README, plan B.')

          html = fetch(DTEK_URL)

          def extract_json(prefix):
              marker = f'{prefix} = '
              idx = html.find(marker)
              if idx == -1:
                  return None
              pos = idx + len(marker)
              while pos < len(html) and html[pos] not in '{[':
                  pos += 1
              open_ch = html[pos]
              close_ch = '}' if open_ch == '{' else ']'
              depth, in_str, esc = 0, False, False
              for i in range(pos, len(html)):
                  ch = html[i]
                  if esc:
                      esc = False
                      continue
                  if ch == '\\' and in_str:
                      esc = True
                      continue
                  if ch == '"':
                      in_str = not in_str
                      continue
                  if not in_str:
                      if ch == open_ch:
                          depth += 1
                      elif ch == close_ch:
                          depth -= 1
                          if depth == 0:
                              return json.loads(html[pos : i + 1])
              return None

          fact = extract_json('DisconSchedule.fact') or {}
          preset = extract_json('DisconSchedule.preset') or {}
          days = fact.get('data') or {}
          if not days:
              sys.exit('DTEK page was downloaded, but the schedule (DisconSchedule.fact) is empty or missing')

          groups = sorted({g for dm in days.values() for g in dm.keys()})
          group_names = {g: f"Черга {g.replace('GPV', '')}" for g in groups}
          group_names.update(preset.get('sch_names') or {})
          print(f'DTEK days in data: {len(days)}, queues: {len(groups)}, updated: {fact.get("update", "")}')

          payload = {
              'snapshot': {
                  'today': fact.get('today'),
                  'update': fact.get('update', ''),
                  'groups': groups,
                  'days': days,
                  'groupNames': group_names,
              }
          }
          body = json.dumps(payload, ensure_ascii=False).encode('utf-8')
          push_req = urllib.request.Request(
              f'{TARGET_URL}?secret={urllib.parse.quote(SECRET, safe="")}',
              data=body,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              resp = urllib.request.urlopen(push_req, timeout=30).read().decode('utf-8')
              print('Push result:', resp)
          except urllib.error.HTTPError as e:
              sys.exit(f'Server rejected the push: HTTP {e.code} {e.read().decode("utf-8", "ignore")[:200]} (check that CRON_SECRET matches the one in your PythonAnywhere WSGI file)')

          # ---- emergency / unplanned outages by address (non-fatal: the schedule is already synced) ----
          try:
              base = TARGET_URL.rsplit('/api/dtek/push-snapshot', 1)[0]
              q = urllib.parse.quote(SECRET, safe='')
              watch = json.loads(urllib.request.urlopen(f'{base}/api/dtek/watchlist?secret={q}', timeout=30).read().decode('utf-8'))
              streets = watch.get('streets') or []
              if not streets:
                  print('Outage check: no addresses with emergency notifications and a house number')
              else:
                  m = re.search(r'<meta name="csrf-token" content="([^"]+)"', html)
                  csrf = m.group(1) if m else ''
                  results = []
                  for item in streets:
                      form = {
                          'method': 'getHomeNum',
                          'data[0][name]': 'city', 'data[0][value]': item['city'],
                          'data[1][name]': 'street', 'data[1][value]': item['street'],
                      }
                      if fact.get('update'):
                          form['data[2][name]'] = 'updateFact'
                          form['data[2][value]'] = fact['update']
                      req = urllib.request.Request(DTEK_AJAX_URL, data=urllib.parse.urlencode(form).encode(), headers={
                          'User-Agent': UA, 'X-Requested-With': 'XMLHttpRequest', 'X-CSRF-Token': csrf,
                          'Referer': DTEK_URL, 'Origin': 'https://www.dtek-dnem.com.ua',
                      })
                      try:
                          data = json.loads(opener.open(req, timeout=25).read().decode('utf-8', 'ignore'))
                      except Exception as e:
                          print(f"Outage check skipped for {item['street']}: {e!r}")
                          continue
                      houses = {}
                      for hk, info in (data.get('data') or {}).items():
                          houses[str(hk)] = {
                              'subType': info.get('sub_type', ''),
                              'startDate': info.get('start_date', ''),
                              'endDate': info.get('end_date', ''),
                              'type': info.get('type', ''),
                          }
                      results.append({'city': item['city'], 'street': item['street'], 'houses': houses})
                      time.sleep(0.7)
                  if results:
                      out_req = urllib.request.Request(
                          f'{base}/api/dtek/push-outages?secret={q}',
                          data=json.dumps({'results': results}, ensure_ascii=False).encode('utf-8'),
                          headers={'Content-Type': 'application/json'}, method='POST')
                      print('Outage check result:', urllib.request.urlopen(out_req, timeout=30).read().decode('utf-8'))
                  else:
                      print('Outage check: DTEK returned nothing (blocked or changed), skipped')
          except Exception as e:
              print('Outage check failed (schedule sync itself is fine):', repr(e))
          PY
          
